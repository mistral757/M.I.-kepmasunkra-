<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vázlat">
<title>Vázlat — __TITLE__</title>
<!-- EZT A FÁJLT NE SZERKESZD: az eszkozok/olvaso.py állítja elő a tervezet/eloadas-tervezet.md-ből. -->
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --fs:19px; --bar:52px; --foot:54px; --pad:20px;
  --bg:#1a1c2c; --fg:#ecebe6; --muted:#94b0c2; --line:#333c57; --card:#232741;
  --accent:#ffcd75; --accent2:#ef7d57; --claude:#73eff7; --teol:#c9a5e8; --plum:#5d275d;
}
:root[data-theme="light"]{
  --bg:#f7f3ea; --fg:#1d1d24; --muted:#56607a; --line:#d9d2c3; --card:#ece5d6;
  --accent:#9a5b00; --accent2:#b13e53; --claude:#0b6b74; --teol:#6b3f8f; --plum:#efe2f2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:var(--fs)/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
/* felső sáv: melyik diánál tartunk */
#bar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;
  display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:3px solid var(--line);z-index:5;overflow:hidden}
#bar .num{flex:none;font:12px/1 'Press Start 2P',monospace;color:var(--muted);white-space:nowrap}
#bar .ttl{flex:1;min-width:0;font-size:16px;line-height:1.2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .tag{flex:none;font:800 13px/1 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.04em;padding:6px 8px;border-radius:3px;background:var(--line);color:var(--muted)}
#bar.new{background:var(--accent);border-bottom-color:var(--accent2)}
#bar.new .num,#bar.new .ttl{color:#1a1c2c}
#bar.new .tag{background:#1a1c2c;color:var(--accent)}
#bar.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.6)}100%{filter:none}}
/* lapozható szöveg */
#view{position:fixed;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top) + 3px);bottom:calc(var(--foot) + env(safe-area-inset-bottom));overflow:hidden;touch-action:pan-y}
#flow{height:100%;padding:16px var(--pad) 10px;column-fill:auto;will-change:transform;transition:transform .22s ease}
#flow.nojump{transition:none}
section.dia{break-before:column;-webkit-column-break-before:always}
section.dia:first-child{break-before:auto;-webkit-column-break-before:auto}
h1{font-size:1.45em;line-height:1.2;margin:.2em 0 .3em}
h2{font-size:1.2em;line-height:1.25;margin:.2em 0 .5em;color:var(--accent2)}
h3{font-size:1.06em;line-height:1.3;margin:.9em 0 .4em}
h4{font-size:1em;margin:.8em 0 .3em}
h1,h2,h3,h4,.blk{break-after:avoid;-webkit-column-break-after:avoid;break-inside:avoid}
blockquote,.onslide{break-inside:avoid;-webkit-column-break-inside:avoid}
p{margin:0 0 .7em;hyphens:auto;-webkit-hyphens:auto}
a{color:var(--claude)}
code{font-size:.9em}
.subt{color:var(--muted);font-style:italic}
.how{font-size:.85em;color:var(--muted);border-top:1px solid var(--line);padding-top:.7em}
.blk{font:11px/1.4 'Press Start 2P',monospace;color:var(--accent2);margin:0 0 .8em;text-transform:none}
.onslide{background:var(--card);border-left:4px solid var(--accent);padding:.55em .8em .4em;margin:0 0 1em;font-size:.86em;line-height:1.35;break-inside:avoid}
.onslide .lbl{font:9px/1 'Press Start 2P',monospace;color:var(--muted);margin:0 0 .5em;letter-spacing:.04em}
.onslide .st{font-weight:700;margin:0 0 .35em}
.onslide p{margin:0 0 .35em;color:var(--muted)}
.onslide ul{margin:.2em 0 .3em;padding-left:1.1em}
.onslide li{margin:0 0 .15em}
.empty{color:var(--muted);font-style:italic}
.li{padding-left:1.1em;text-indent:-1.1em}
.li::before{content:"•";display:inline-block;width:1.1em;text-indent:0;color:var(--accent)}
.li2{margin-left:1.1em}
.ol{padding-left:1.6em;text-indent:-1.6em}
.ol .n{display:inline-block;width:1.6em;text-indent:0;font-weight:700;color:var(--accent)}
.ol.cont{text-indent:0}
blockquote{margin:0 0 .7em;padding:.45em .8em;border-left:4px solid var(--teol);background:var(--plum);border-radius:2px}
.claude{border-left:4px solid var(--claude);padding-left:.7em}
.claude strong:first-child{color:var(--claude)}
.teol strong:first-child{color:var(--teol)}
.hatter strong:first-child{color:var(--muted)}
.warn{color:var(--accent2);font-weight:700}
/* alsó sáv */
#foot{position:fixed;left:0;right:0;bottom:0;height:calc(var(--foot) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  display:flex;align-items:center;gap:4px;background:var(--card);border-top:1px solid var(--line);z-index:5}
#foot button{flex:none;min-width:44px;height:42px;border:0;border-radius:6px;background:transparent;color:var(--fg);font:600 17px/1 inherit;cursor:pointer}
#foot button:active{background:var(--line)}
#foot .nav{font-size:22px;color:var(--accent)}
#foot .grow{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap}
#prog{position:absolute;left:0;top:-3px;height:3px;background:var(--accent);width:0}
/* tartalomjegyzék */
#toc{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
#toc.open{display:flex}
#toc .hd{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);font-weight:700}
#toc .hd button{border:0;background:var(--line);color:var(--fg);font:inherit;padding:8px 14px;border-radius:6px}
#toc ol{list-style:none;margin:0;padding:6px 0 calc(20px + env(safe-area-inset-bottom));overflow:auto;flex:1}
#toc li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:16px/1.3 inherit;padding:9px 16px}
#toc li button .k{flex:none;width:2.4em;color:var(--muted);font-variant-numeric:tabular-nums}
#toc li.here button{background:var(--card);font-weight:700}
#fsask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,16,32,.9)}
#fsask[hidden]{display:none}
#fsask .box{width:min(420px,100%);background:var(--card);border-top:4px solid var(--accent);padding:22px 20px;display:flex;flex-direction:column;gap:12px}
#fsask p{margin:0}
#fsask .t{font:12px/1.5 'Press Start 2P',monospace;color:var(--accent)}
#fsask button{font:600 17px/1.2 inherit;border:0;border-radius:6px;padding:14px;cursor:pointer;background:var(--accent);color:#1a1c2c}
#fsask button.sec{background:var(--line);color:var(--fg)}
#toc li.b{padding:12px 16px 4px;font:10px/1.4 'Press Start 2P',monospace;color:var(--accent2)}
</style>
</head>
<body>
<header id="bar" aria-live="polite"><span class="tag" hidden>ÚJ DIA</span><span class="num"></span><span class="ttl"></span></header>
<main id="view"><div id="flow"><!--__BODY__--></div></main>
<footer id="foot">
  <div id="prog"></div>
  <button type="button" class="nav" id="prev" aria-label="Előző oldal">◀</button>
  <button type="button" id="smaller" aria-label="Kisebb betű">A−</button>
  <button type="button" id="bigger" aria-label="Nagyobb betű">A+</button>
  <button type="button" id="theme" aria-label="Világos / sötét">◐</button>
  <span class="grow" id="pg"></span>
  <button type="button" id="fsbtn" aria-label="Teljes képernyő">⛶</button>
  <button type="button" id="tocbtn" aria-label="Tartalom">☰</button>
  <button type="button" class="nav" id="next" aria-label="Következő oldal">▶</button>
</footer>
<div id="fsask" role="dialog" aria-modal="true" aria-label="Teljes képernyő">
  <div class="box">
    <p class="t">Vázlat</p>
    <p id="fsmsg">Váltsunk teljes képernyőre? Így csak a szöveg látszik.</p>
    <button type="button" id="fsyes">Teljes képernyő</button>
    <button type="button" id="fsno" class="sec">Most nem</button>
  </div>
</div>
<div id="toc" role="dialog" aria-label="Tartalom">
  <div class="hd"><span>Ugrás diára</span><button type="button" id="tocclose">Bezár</button></div>
  <ol id="toclist"></ol>
</div>
<script>
const META = /*__META__*/;
const TOTAL = META.length;
const store = { get(k, d){ try { const v = localStorage.getItem('mi-vazlat-' + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
                set(k, v){ try { localStorage.setItem('mi-vazlat-' + k, JSON.stringify(v)); } catch (_) {} } };
const root = document.documentElement, flow = document.getElementById('flow'), view = document.getElementById('view');
const bar = document.getElementById('bar'), tag = bar.querySelector('.tag');
let fs = store.get('fs', 19), page = 0, pages = 1, W = 0, starts = [], slideOfPage = [], lastSlide = null;
const sections = [...flow.querySelectorAll('section.dia')];
root.dataset.theme = store.get('theme', 'dark');

function layout(keep){
  const anchor = keep || currentAnchor();
  root.style.setProperty('--fs', fs + 'px');
  W = view.clientWidth;
  const pad = Math.max(16, Math.min(28, Math.round(W * 0.05)));
  root.style.setProperty('--pad', pad + 'px');
  flow.style.columnWidth = (W - 2 * pad) + 'px';
  flow.style.columnGap = (2 * pad) + 'px';
  flow.classList.add('nojump'); flow.style.transform = 'none';
  const base = flow.getBoundingClientRect().left;
  pages = Math.max(1, Math.round(flow.scrollWidth / W));
  starts = sections.map(s => Math.round((s.getBoundingClientRect().left - base - pad) / W));
  slideOfPage = [];
  for (let p = 0, k = 0; p < pages; p++){ while (k + 1 < sections.length && starts[k + 1] <= p) k++; slideOfPage[p] = k; }
  page = anchor ? Math.min(pages - 1, starts[anchor.k] + Math.round(anchor.f * spanOf(anchor.k))) : 0;
  show(false);
  requestAnimationFrame(() => flow.classList.remove('nojump'));
}
const spanOf = k => Math.max(1, (k + 1 < starts.length ? starts[k + 1] : pages) - starts[k]);
function currentAnchor(){
  if (!starts.length) return null;
  const k = slideOfPage[page] ?? 0;
  return { k, f: (page - starts[k]) / spanOf(k) };
}
function show(animate = true){
  flow.style.transform = `translateX(${-page * W}px)`;
  const k = slideOfPage[page], sec = sections[k], n = +sec.dataset.n;
  const first = starts[k] === page;
  const num = bar.querySelector('.num'), ttl = bar.querySelector('.ttl');
  if (n > 0){
    const m = META[n - 1];
    num.textContent = n + '/' + TOTAL;
    ttl.textContent = m.t + (first ? '' : ' — folytatás');
  } else { num.textContent = ''; ttl.textContent = n === 0 ? 'Bevezető' : 'Függelék: nyitott ellenőrzések'; }
  const isNew = first && n > 0;
  bar.classList.toggle('new', isNew); tag.hidden = !isNew;
  if (isNew && animate && lastSlide !== null && k > lastSlide){
    bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash');
    try { navigator.vibrate && navigator.vibrate(40); } catch (_) {}
  }
  lastSlide = k;
  document.getElementById('pg').textContent = `${page + 1} / ${pages} oldal`;
  document.getElementById('prog').style.width = (pages > 1 ? page / (pages - 1) * 100 : 100) + '%';
  store.set('pos', currentAnchor());
}
function go(p){ p = Math.max(0, Math.min(pages - 1, p)); if (p !== page){ page = p; show(); } }
const next = () => go(page + 1), prev = () => go(page - 1);

/* vezérlés */
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('bigger').onclick = () => { fs = Math.min(32, fs + 1); store.set('fs', fs); layout(); };
document.getElementById('smaller').onclick = () => { fs = Math.max(14, fs - 1); store.set('fs', fs); layout(); };
document.getElementById('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light'; store.set('theme', root.dataset.theme); };
addEventListener('keydown', e => {
  if (!document.getElementById('fsask').hidden) return;
  if (document.getElementById('toc').classList.contains('open')){ if (e.key === 'Escape') toggleToc(false); return; }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
});
view.addEventListener('click', e => {
  if (e.target.closest('a') || getSelection().toString()) return;
  const x = e.clientX / view.clientWidth;
  if (x > 0.7) next(); else if (x < 0.3) prev();
});
let t0 = null;
view.addEventListener('touchstart', e => { t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null; }, { passive: true });
view.addEventListener('touchend', e => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y; t0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3){ e.preventDefault(); (dx < 0 ? next : prev)(); }
});
let rt = null;
const relayout = () => { clearTimeout(rt); rt = setTimeout(() => layout(), 150); };
addEventListener('resize', relayout); addEventListener('orientationchange', relayout);

/* tartalom */
const tl = document.getElementById('toclist');
function toggleToc(open){
  const box = document.getElementById('toc'); box.classList.toggle('open', open);
  if (open){ tl.querySelectorAll('li.here').forEach(l => l.classList.remove('here'));
    const cur = tl.querySelector(`li[data-k="${slideOfPage[page]}"]`); if (cur){ cur.classList.add('here'); cur.scrollIntoView({ block: 'center' }); } }
}
(function buildToc(){
  let lastBlock = null;
  sections.forEach((s, k) => {
    const n = +s.dataset.n, m = n > 0 ? META[n - 1] : null;
    if (m && m.b && m.b !== lastBlock){ lastBlock = m.b; const h = document.createElement('li'); h.className = 'b'; h.textContent = m.b; tl.append(h); }
    const li = document.createElement('li'); li.dataset.k = k;
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<span class="k">${n > 0 ? n + '.' : ''}</span><span></span>`;
    b.lastChild.textContent = m ? m.t : (n === 0 ? 'Bevezető' : 'Függelék');
    b.onclick = () => { toggleToc(false); page = starts[k]; lastSlide = null; show(false); };
    li.append(b); tl.append(li);
  });
})();
document.getElementById('tocbtn').onclick = () => toggleToc(true);
document.getElementById('tocclose').onclick = () => toggleToc(false);

/* teljes képernyő: a böngészők csak kattintásra engedik, ezért induláskor felajánljuk */
const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFs(){
  const el = document.documentElement;
  try {
    if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => {});
  } catch (_) {}
}
(function askFs(){
  const ask = document.getElementById('fsask'), close = () => { ask.hidden = true; };
  if (!fsOK()){
    document.getElementById('fsmsg').textContent = 'Ezen a telefonon a böngésző nem enged teljes képernyőt. Tipp: Safariban a Megosztás → „Főképernyőhöz adás”, és onnan megnyitva teljes képernyőn fut.';
    document.getElementById('fsyes').hidden = true;
    document.getElementById('fsno').textContent = 'Rendben';
    document.getElementById('fsbtn').hidden = true;
  }
  document.getElementById('fsyes').onclick = () => { toggleFs(); close(); };
  document.getElementById('fsno').onclick = close;
  document.getElementById('fsbtn').onclick = toggleFs;
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, relayout));
})();

/* indulás: a betűk betöltése után tördelünk, és visszaállunk oda, ahol legutóbb tartottál */
const startup = () => layout(store.get('pos', null));
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(startup);
</script>
</body>
</html>
